name: Build AquaSave APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Archive
        run: |
          python3 - << 'EOF'
          import zipfile, os
          with zipfile.ZipFile('aquasave_project.zip') as z:
              for f in z.infolist():
                  target = f.filename.replace('\\', '/')
                  if target.endswith('/'):
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, 'wb') as out:
                          out.write(z.read(f))
          print("Fayllar muvaffaqiyatli chiqarildi!")
          print(os.listdir('.'))
          EOF

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Gradle & Build APK
        run: |
          cd flutter_app
          flutter create --platforms=android --org=uz.aquasave .
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaSave-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
